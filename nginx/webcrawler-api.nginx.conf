# ─────────────────────────────────────────────────────────────
#  WebCrawler — Nginx config (VPS, API only)
#  Frontend is on Vercel — this only proxies the backend API.
#
#  Setup:
#    cp nginx/webcrawler-api.nginx.conf /etc/nginx/sites-available/webcrawler-api
#    ln -s /etc/nginx/sites-available/webcrawler-api /etc/nginx/sites-enabled/
#    nginx -t && systemctl reload nginx
#
#  Then add SSL:
#    certbot --nginx -d api.yourdomain.com
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name api.yourdomain.com;

    # Redirect HTTP → HTTPS once SSL is configured
    # return 301 https://$host$request_uri;

    # ── REST API ────────────────────────────────────────────
    # SSE (streaming chat) — disable buffering
    location /api/v1/chat/ {
        proxy_pass         http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass         http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Allow large crawl responses
        client_max_body_size 50M;
    }

    # ── WebSocket (live job monitor) ────────────────────────
    location /ws/ {
        proxy_pass         http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── CORS preflight (backup — FastAPI handles this too) ──
    add_header 'Access-Control-Allow-Origin'  '$http_origin' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
}

